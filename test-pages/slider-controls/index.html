<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider Controls Design Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="test-container">
    <h1>Member Slider Controls - Design Test</h1>

    <section class="test-section">
      <h2>Option 1: Gothic Ornamental Arrows</h2>
      <div class="member-slider__controls controls-v1">
        <button class="member-slider__btn member-slider__btn--prev" data-action="prev" aria-label="前のメンバー">
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
          </svg>
        </button>
        <div class="member-slider__dots">
          <button class="member-slider__dot is-active" aria-label="メンバー 1"></button>
          <button class="member-slider__dot" aria-label="メンバー 2"></button>
          <button class="member-slider__dot" aria-label="メンバー 3"></button>
          <button class="member-slider__dot" aria-label="メンバー 4"></button>
        </div>
        <button class="member-slider__btn member-slider__btn--next" data-action="next" aria-label="次のメンバー">
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="test-section">
      <h2>Option 2: Ornate Frame Arrows</h2>
      <div class="member-slider__controls controls-v2">
        <button class="member-slider__btn member-slider__btn--prev" data-action="prev" aria-label="前のメンバー">
          <svg class="arrow-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 24L12 16L20 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="1" opacity="0.4" rx="2"/>
            <rect x="5" y="5" width="22" height="22" stroke="currentColor" stroke-width="0.5" opacity="0.2" rx="1"/>
          </svg>
        </button>
        <div class="member-slider__dots">
          <button class="member-slider__dot is-active" aria-label="メンバー 1"></button>
          <button class="member-slider__dot" aria-label="メンバー 2"></button>
          <button class="member-slider__dot" aria-label="メンバー 3"></button>
          <button class="member-slider__dot" aria-label="メンバー 4"></button>
        </div>
        <button class="member-slider__btn member-slider__btn--next" data-action="next" aria-label="次のメンバー">
          <svg class="arrow-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 24L20 16L12 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="1" opacity="0.4" rx="2"/>
            <rect x="5" y="5" width="22" height="22" stroke="currentColor" stroke-width="0.5" opacity="0.2" rx="1"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="test-section">
      <h2>Option 3: Minimal Elegant</h2>
      <div class="member-slider__controls controls-v3">
        <button class="member-slider__btn member-slider__btn--prev" data-action="prev" aria-label="前のメンバー">
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 20L8 12L16 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="2" y1="12" x2="8" y2="12" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
          </svg>
        </button>
        <div class="member-slider__dots">
          <button class="member-slider__dot is-active" aria-label="メンバー 1"></button>
          <button class="member-slider__dot" aria-label="メンバー 2"></button>
          <button class="member-slider__dot" aria-label="メンバー 3"></button>
          <button class="member-slider__dot" aria-label="メンバー 4"></button>
        </div>
        <button class="member-slider__btn member-slider__btn--next" data-action="next" aria-label="次のメンバー">
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 20L16 12L8 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="16" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
          </svg>
        </button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>section-heading svg demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="spacer">Scroll down</div>
    <section class="section">
      <header class="section-heading" data-heading="story">
        <svg viewBox="0 0 320 60" aria-hidden="true">
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">STORY</text>
        </svg>
      </header>
    </section>
    <section class="section">
      <header class="section-heading" data-heading="member">
        <svg viewBox="0 0 360 60" aria-hidden="true">
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">MEMBER</text>
        </svg>
      </header>
    </section>
    <section class="section">
      <header class="section-heading" data-heading="news">
        <svg viewBox="0 0 300 60" aria-hidden="true">
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">NEWS</text>
        </svg>
      </header>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>

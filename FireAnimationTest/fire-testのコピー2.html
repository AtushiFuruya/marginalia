<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fire Background Test</title>
  <style>
    :root{
      color-scheme:dark;
    }
    *{box-sizing:border-box;padding:0;margin:0;}
    body{
      background:#050505;
      min-height:100vh;
      font-family:"IM Fell DW Pica SC","Noto Serif JP",serif;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    canvas{position:fixed;inset:0;z-index:-1;display:block;}
    .notice{
      text-align:center;
      color:#f4d8c1;
      letter-spacing:0.15em;
      font-size:clamp(1rem,2vw,1.35rem);
      text-transform:uppercase;
      background:rgba(5,2,2,0.6);
      padding:1.5rem 2rem;
      border:1px solid rgba(244,216,193,0.25);
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <canvas id="fire-canvas"></canvas>
  <div class="notice">Fire Background Test<br>Three.js + Shader Material</div>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    const canvas = document.getElementById('fire-canvas');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    const scene = new THREE.Scene();
    const camera = new THREE.Camera();

    const uniforms = {
      uTime: {value: 0},
      uResolution: {value: new THREE.Vector2(window.innerWidth, window.innerHeight)}
    };

    const vertexShader = `
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec2 vUv;
      uniform float uTime;
      uniform vec2 uResolution;

      vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
      vec2 fade(vec2 t){return t*t*t*(t*(t*6.0-15.0)+10.0);}
      float noise(vec2 P){
        vec4 Pi = floor(vec4(P,P)+vec4(0.0,0.0,1.0,1.0));
        vec4 Pf = fract(vec4(P,P)+vec4(0.0,0.0,1.0,1.0));
        Pi = mod(Pi,289.0);
        vec4 ix = vec4(Pi.x,Pi.z,Pi.x,Pi.z);
        vec4 iy = vec4(Pi.y,Pi.y,Pi.w,Pi.w);
        vec4 fx = vec4(Pf.x,Pf.z,Pf.x,Pf.z);
        vec4 fy = vec4(Pf.y,Pf.y,Pf.w,Pf.w);
        vec4 i = permute(permute(ix)+iy);
        vec4 gx = fract(i*(1.0/41.0))*2.0-1.0;
        vec4 gy = abs(gx)-0.5;
        vec4 tx = floor(gx+0.5);
        gx = gx-tx;
        vec2 g00 = vec2(gx.x,gy.x);
        vec2 g10 = vec2(gx.y,gy.y);
        vec2 g01 = vec2(gx.z,gy.z);
        vec2 g11 = vec2(gx.w,gy.w);
        vec4 norm = 1.79284291400159 - 0.85373472095314 *
          vec4(dot(g00,g00), dot(g01,g01), dot(g10,g10), dot(g11,g11));
        g00 *= norm.x; g01 *= norm.y; g10 *= norm.z; g11 *= norm.w;
        float n00 = dot(g00, vec2(fx.x, fy.x));
        float n10 = dot(g10, vec2(fx.y, fy.y));
        float n01 = dot(g01, vec2(fx.z, fy.z));
        float n11 = dot(g11, vec2(fx.w, fy.w));
        vec2 fade_xy = fade(vec2(Pf.x, Pf.y));
        vec2 n_x = mix(vec2(n00,n01), vec2(n10,n11), fade_xy.x);
        float n_xy = mix(n_x.x, n_x.y, fade_xy.y);
        return 2.3 * n_xy;
      }

      float fbm(vec2 p){
        float value = 0.0;
        float amplitude = 0.7;
        float frequency = 1.0;
        for(int i = 0; i < 5; i++){
          value += amplitude * noise(p * frequency);
          frequency *= 1.8;
          amplitude *= 0.55;
          p += vec2(0.5, -0.35);
        }
        return value;
      }

      void main(){
        vec2 uv = vUv * 2.0 - 1.0;
        uv.x *= uResolution.x / uResolution.y;

        float time = uTime * 0.55;
        vec2 flow = uv;
        flow.y += time * 1.05;
        flow.x += sin(time * 0.8 + uv.y * 3.5) * 0.14;
        flow.x += sin(time * 0.35 + uv.y * 9.0) * 0.03;
        flow += vec2(fbm(vec2(uv.y * 4.0, time * 0.4)) * 0.08, 0.0);

        float base = fbm(flow * 1.6);
        float detail = fbm(flow * 3.8);
        float flicker = fbm(vec2(uv.x * 2.2, time * 2.4));

        float flame = smoothstep(-0.45, 0.9, base * 1.1 + detail * 0.55 + uv.y * 1.25 + flicker * 0.35);
        float heightMask = smoothstep(-1.05, 0.3, uv.y);
        flame *= heightMask;

        float blueCore = smoothstep(-0.85, -0.25, uv.y) * smoothstep(0.4, 0.9, flame);

        vec3 dark = vec3(0.01, 0.005, 0.01);
        vec3 baseBlue = vec3(0.08, 0.2, 0.42);
        vec3 core = vec3(1.0, 0.95, 0.65);
        vec3 mid = vec3(1.0, 0.55, 0.12);
        vec3 outer = vec3(0.7, 0.18, 0.04);

        vec3 color = mix(dark, outer, flame);
        color = mix(color, mid, pow(flame, 1.2));
        color = mix(color, core, pow(flame, 3.0));
        color = mix(color, baseBlue, blueCore);

        float alpha = clamp(flame * 1.2, 0.0, 1.0);
        color = mix(dark, color, alpha);
        gl_FragColor = vec4(color, alpha);
      }
    `;

    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      transparent: true
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function resize(){
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      uniforms.uResolution.value.set(width, height);
    }
    window.addEventListener('resize', resize);
    resize();

    const clock = new THREE.Clock();
    function render(){
      uniforms.uTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
